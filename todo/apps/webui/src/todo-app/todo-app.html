<main aria-labelledby="todo-app-title" class="todo-app" @click="{onClick(e)}">
  <todo-header
    :app="{{app}}"
    :variantlabel="{{variantLabel}}"
    data-component="todo-header"
  ></todo-header>
  <todo-summary
    :summary="{{summary}}"
    data-component="todo-summary"
  ></todo-summary>
  <todo-toolbar
    :selection="{{selection}}"
    :toolbar="{{toolbar}}"
    data-component="todo-toolbar"
  ></todo-toolbar>
  <todo-list :todos="{{todos}}" data-component="todo-list"></todo-list>
  <todo-footer :footer="{{footer}}" data-component="todo-footer"></todo-footer>
</main>
