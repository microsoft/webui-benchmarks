<div aria-label="{{tagcountlabel}}" class="todo-tag-list">
  <for each="tag in tags">
    <span
      class="todo-tag"
      data-tag-id="{{tag.id}}"
      data-tone="{{tag.tone}}"
    >{{tag.label}}</span>
  </for>
</div>
