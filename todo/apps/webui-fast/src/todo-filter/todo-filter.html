<button
  aria-label="{{label}}: {{countlabel}}"
  aria-pressed="{{active}}"
  class="todo-filter"
  data-action="filter"
  ?data-active="{{active}}"
  data-filter="{{filterid}}"
  type="button"
>
  <span>{{label}}</span>
  <span class="todo-filter__count">{{countlabel}}</span>
</button>
