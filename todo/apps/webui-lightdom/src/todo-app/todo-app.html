<main
  aria-labelledby="todo-app-title"
  class="todo-app"
  data-route-page="work"
  @click="{onClick(e)}"
>
  <boundary name="workbench-ready" key="{{variantLabel}}">
  <todo-header
    :app="{{app}}"
    :variantlabel="{{variantLabel}}"
    data-component="todo-header"
  ></todo-header>
  <todo-summary
    :summary="{{summary}}"
    data-component="todo-summary"
  ></todo-summary>
  <workspace-intelligence
    :intelligence="{{intelligence}}"
    :todos="{{todos}}"
    @workspace-change="{onWorkspaceChange(e)}"
    data-component="workspace-intelligence"
  ></workspace-intelligence>
  </boundary>
  <todo-toolbar
    :selection="{{selection}}"
    :toolbar="{{toolbar}}"
    data-component="todo-toolbar"
  ></todo-toolbar>
  <todo-list :todos="{{todos}}" data-component="todo-list"></todo-list>
  <todo-footer :footer="{{footer}}" data-component="todo-footer"></todo-footer>
</main>
