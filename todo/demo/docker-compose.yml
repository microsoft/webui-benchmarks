# Local run of the demo image that is deployed as a single Azure Container App:
#
#   docker compose -f todo/demo/docker-compose.yml up --build

services:
  demo:
    build:
      context: ../..
      dockerfile: todo/demo/Dockerfile
    environment:
      PORT: "8080"
      WEBUI_DEMO_CONCURRENCY: "4"
      WEBUI_DEMO_RATE_LIMIT: "0"
    init: true
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
